services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: talus
      POSTGRES_USER: talus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talus_dev}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U talus"], interval: 10s, retries: 5 }
  api:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgres://talus:${POSTGRES_PASSWORD:-talus_dev}@db:5432/talus
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      AUTO_ALERT_ENABLED: "true"
      AUTO_ALERT_SMS: ${AUTO_ALERT_SMS:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      SMS_API_KEY: ${SMS_API_KEY:-}
      IMD_API_KEY: ${IMD_API_KEY:-}
    depends_on: [db]
    volumes: ["./runs:/app/runs"]
    healthcheck: { test: ["CMD","curl","-fsS","http://localhost:8000/health"], interval: 30s, retries: 3 }
  # Frontend served by api static (frontend/dist) — no separate service needed
volumes: { pgdata: {} }
